[project]
name = "karuta-yolo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JM43-ym", email = "misakih358@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.215",
]

[project.scripts]
karuta-yolo = "karuta_yolo:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
